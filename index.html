  const a=chars.filter(c=>c.status==='approved').sort((x,y)=>y.stage-x.stage||y.exp-x.exp);
  body=`<div class="card" style="overflow-x:auto"><table><tr><th>ตัวละคร</th><th>ผู้เล่น</th><th>ระดับ</th><th>EXP</th><th>💰</th><th>จัดการ</th></tr>
  ${a.map(c=>`<tr><td><a href="#char/${c.id}">${esc(c.stageName||c.name)}</a></td><td>${uname(c.ownerId)}</td><td>${stageBadge(c.stage)} ${eligible(c)?'<span class="badge" style="--c:var(--ok)">⬆ พร้อม</span>':''}</td><td>${c.exp}</td><td class="won">${wonFmt(c.won)}</td>
  <td><div class="row">${hasAdminPermission('manage_characters')?`<button class="btn sm ok" title="เลื่อนขั้น" onclick="setStage('${c.id}',1)">▲</button><button class="btn sm ghost" title="ลดขั้น" onclick="setStage('${c.id}',-1)">▼</button><button class="btn sm ghost" onclick="giveExp('${c.id}')">±EXP</button>`:''}${(hasAdminPermission('manage_economy')||hasAdminPermission('manage_characters'))?`<button class="btn sm ghost" onclick="giveWon('${c.id}')">±₩</button>`:''}</div></td></tr>`).join('')}</table>
  ${a.length?'':'<p class="mut">ยังไม่มีตัวละครที่อนุมัติ</p>'}</div>`;
 }else if(tab==='newthread')body=threadForm(null,sub);
 else if(tab==='forums')body=forumsBody();
 else if(tab==='shop'){
  const items=DB.get('items'),ed=sub&&items.find(x=>x.id===sub);
  body=itemForm(ed)+`<div class="card" style="overflow-x:auto"><table><tr><th>สินค้า</th><th>หมวด</th><th>ราคา</th><th>คงเหลือ</th><th>ขายแล้ว</th><th></th></tr>
  ${items.map(it=>`<tr><td><div class="row">${it.img?`<img src="${esc(it.img)}" style="width:36px;height:36px;object-fit:cover;border-radius:6px">`:'🎁'} ${esc(it.name)}</div></td><td>${esc(it.cat)}</td><td class="won">${wonFmt(it.price)}</td><td>${it.stock<0?'∞':it.stock}</td><td>${chars.reduce((n,c)=>n+(c.inv||[]).filter(x=>x.iid===it.id).length,0)}</td>
  <td><div class="row"><a class="btn sm ghost" href="#admin/shop/${it.id}">แก้ไข</a><button class="btn sm bad" onclick="deleteItem('${it.id}')">ลบ</button></div></div></td></tr>`).join('')}</table>${items.length?'':'<p class="mut">ยังไม่มีสินค้า</p>'}</div>`;
 }else if(tab==='agencies'){
  body=`${ags.length?`<div class="card" style="overflow-x:auto"><table><tr><th>ค่าย</th><th>รับสมัคร</th><th>สมาชิก</th><th></th></tr>
  ${ags.map(a=>`<tr><td><a href="#agency/${a.id}">${esc(a.name)}</a></td><td>${a.recruiting?'🟢 เปิด':'⚪ ปิด'}</td><td>${agencyMembers(a).length}</td>
  <td><div class="row"><a class="btn sm ghost" href="#editagency/${a.id}">แก้ไข</a><button class="btn sm bad" onclick="deleteAgency('${a.id}')">ลบ</button></div></div></td></tr>`).join('')}</table></div>`:''}${agencyForm()}`;
 }else if(tab==='groups'){
  const ready=chars.filter(c=>c.status==='approved'&&c.stage>=DEBUT_STAGE&&!groupOf(c.id));
  body=`<div class="row between"><p class="mut">ตัวละครพร้อมเดบิวต์ที่ยังไม่มีวง: <b>${ready.length}</b> คน</p><a class="btn" href="#editgroup/new">+ จัดวงใหม่</a></div>
  <div class="card" style="overflow-x:auto"><table><tr><th>วง</th><th>ประเภท</th><th>สมาชิก</th><th>สถานะ</th><th></th></tr>
  ${groups.map(g=>`<tr><td><a href="#group/${g.id}">${esc(g.name)}</a></td><td>${esc(g.type)}</td><td>${g.members.length}</td><td><span class="badge" style="--c:${GST[g.status][1]}">${GST[g.status][0]}</span></td>
  <td><div class="row"><a class="btn sm ghost" href="#editgroup/${g.id}">แก้ไข</a>${g.status==='planning'?`<button class="btn sm ok" onclick="debutGroup('${g.id}')">🎉 เดบิวต์</button>`:''}</div></div></td></tr>`).join('')}</table>${groups.length?'':'<p class="mut">ยังไม่มีวง</p>'}</div>`;
 }else if(tab==='users'){
  const u=me();
  body=`<div class="card" style="overflow-x:auto"><p class="mut">แอดมินหลักเท่านั้นที่กำหนดสิทธิ์แอดมินย่อยได้ แอดมินย่อยไม่สามารถเพิ่มสิทธิ์ให้ตัวเองหรือผู้อื่น</p><table><tr><th>ชื่อผู้ใช้</th><th>บทบาท</th><th>ตัวละคร</th><th>สมัครเมื่อ</th><th></th></tr>
  ${users.map(x=>`<tr><td><a href="#profile/${x.id}"><b>${esc(x.username)}</b></a></td><td>${x.role==='admin'?(Array.isArray(x.permissions)&&x.permissions.length?'👑 แอดมินกำหนดสิทธิ์':'👑 แอดมิน'):'ผู้เล่น'}</td><td>${chars.filter(c=>c.ownerId===x.id).length}</td><td>${fmt(x.createdAt)}</td>
  <td>${x.id!==u.id&&isAdmin()?`<button class="btn sm ghost" onclick="openAdminPermissions('${x.id}')">กำหนดสิทธิ์</button>`:'<span class="mut">—</span>'}</td></tr>`).join('')}</table></div>`;
 }else if(tab==='settings')body=settingsForm();
 app(`<h2>👑 แผงควบคุมแอดมิน</h2><div class="tabs">${T.map(([k,n])=>`<a href="#admin/${k}" class="${tab===k?'on':''}">${n}</a>`).join('')}</div>${body}`);
}


function approveChar(id){if(!hasAdminPermission('manage_character_review'))return toast('ไม่มีสิทธิ์อนุมัติตัวละคร','bad');update('characters',id,c=>{c.status='approved';c.reason=''});toast('อนุมัติตัวละครแล้ว');render()}
async function rejectChar(id){if(!hasAdminPermission('manage_character_review'))return toast('ไม่มีสิทธิ์ปฏิเสธตัวละคร','bad');const r=await askText('เหตุผลที่ไม่อนุมัติ (ผู้เล่นจะเห็นข้อความนี้):');if(r===null)return;update('characters',id,c=>{c.status='rejected';c.reason=r});toast('ไม่อนุมัติแล้ว');render()}
function setStage(id,d){if(!hasAdminPermission('manage_characters'))return toast('ไม่มีสิทธิ์จัดการระดับตัวละคร','bad');const c=update('characters',id,c=>{c.stage=Math.max(0,Math.min(STAGES.length-1,c.stage+d))});toast(`${c.stageName||c.name} → ${STAGES[c.stage].n}`);render()}
async function giveExp(id){if(!hasAdminPermission('manage_characters'))return toast('ไม่มีสิทธิ์จัดการ EXP','bad');const r=await askText('จำนวน EXP (ใส่ค่าลบเพื่อหัก):','10');if(r===null)return;const v=parseInt(r);if(isNaN(v))return toast('กรุณาใส่ตัวเลข','bad');update('characters',id,c=>c.exp=Math.max(0,c.exp+v));toast('อัปเดต EXP แล้ว');render()}
function toggleThread(id){if(!hasAdminPermission('manage_threads'))return toast('ไม่มีสิทธิ์จัดการกระทู้','bad');update('threads',id,t=>t.status=t.status==='open'?'closed':'open');render()}
function pinThread(id){if(!hasAdminPermission('manage_threads'))return toast('ไม่มีสิทธิ์จัดการกระทู้','bad');update('threads',id,t=>t.pinned=!t.pinned);render()}
async function deleteThread(id){if(!hasAdminPermission('manage_threads')||!await ask('ลบกระทู้นี้และโพสต์ทั้งหมด?'))return;DB.set('threads',DB.get('threads').filter(t=>t.id!==id));DB.set('posts',DB.get('posts').filter(p=>p.threadId!==id));toast('ลบกระทู้แล้ว');go('threads')}
async function deletePost(id){if(!hasAdminPermission('manage_posts')||!await ask('ลบโพสต์นี้?'))return;DB.set('posts',DB.get('posts').filter(p=>p.id!==id));render()}
function toggleAdmin(id){if(!isAdmin())return toast('มีเพียงแอดมินหลักที่กำหนดสิทธิ์แอดมินได้','bad');openAdminPermissions(id)}
async function deleteChar(id){
 const u=me(),c=DB.get('characters').find(x=>x.id===id);
 if(!c||!(isAdmin()||hasAdminPermission('manage_characters')||(c.ownerId===u?.id&&c.status!=='approved'))||!await ask('ลบตัวละครนี้ตัวนี้?'))return;
 DB.set('characters',DB.get('characters').filter(x=>x.id!==id));
 const gs=DB.get('groups');gs.forEach(g=>g.members=g.members.filter(m=>m.charId!==id));DB.set('groups',gs);
 toast('ลบตัวละครแล้ว');go('mychars');
}

/* ================= RICH EDITOR ACTIONS =================
   Use delegated events because the editor forms are rendered dynamically
   into #app. This avoids inline-handler scope and stale-form issues. */
document.addEventListener('click',function(e){
 const button=e.target&&e.target.closest?e.target.closest('[data-editor-action]'):null;
 if(!button)return;
 const action=button.dataset.editorAction;
 if(action==='announcement'){
  e.preventDefault();
  insertPostAnnouncement(button);
  return;
 }
 if(action==='toggle-html'){
  e.preventDefault();
  toggleEditorSource(button);
  return;
 }
 if(action==='preview'){
  e.preventDefault();
  preview(button.closest('form'));
 }
});

/* ================= START ================= */
async function startApp(){
 try{
  await cloudBootstrap();migrate();render();
  if(cloudReady&&me())loadMailFolder('inbox',me().id);
  if(cloudFirstAdminUsername)cloudShowFirstAdminSetup(cloudFirstAdminUsername);
 }catch(e){console.error(e);document.getElementById('app').innerHTML=`<div class="card" style="border-color:var(--bad)"><h2>เกิดข้อผิดพลาดในการโหลด</h2><p>${esc(e.message)}</p><button class="btn" onclick="exportData()">⬇ สำรองข้อมูลก่อน</button></div>`}
 if(store.temp)toast('โหมดพรีวิว: ข้อมูลจะหายเมื่อรีเฟรช — เปิดไฟล์ในเบราว์เซอร์โดยตรงเพื่อบันทึกถาวร','bad');
 startPresenceTracking();
}
startApp();
</script>
