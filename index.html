<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainee Roleplay</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--card:#111113;--card2:#19191d;--line:#303036;--pri:#d6d6dc;--sec:#85858f;--txt:#ededf0;--mut:#a0a0aa;--ok:#66d6a4;--warn:#e5c879;--bad:#ff7272}
*{box-sizing:border-box}
body{margin:0;font-family:'Prompt',sans-serif;background:radial-gradient(circle at 20% 0,color-mix(in srgb,var(--sec) 22%,var(--bg)) 0,var(--bg) 55%) fixed;background-color:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh}
a{color:var(--pri);text-decoration:none;cursor:pointer}
nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:1.3rem;background:linear-gradient(90deg,var(--pri),var(--sec));-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.links a{color:var(--txt)}.links a:hover{color:var(--pri)}
.dot{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem}
.me-pill{display:flex;align-items:center;gap:8px;background:var(--card2);padding:3px 14px 3px 3px;border-radius:99px;border:1px solid var(--line)}
.me-pill select{background:transparent;border:0;color:var(--txt);padding:0;margin:0;width:auto;font-size:.85rem;font-weight:600;cursor:pointer}
.me-pill option{background:var(--card)}
main{max-width:1150px;margin:0 auto;padding:24px 16px 60px}
h2{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;padding:9px 18px;border-radius:10px;background:linear-gradient(90deg,var(--pri),var(--sec));color:#fff!important;font-weight:600}
.btn.sm{padding:4px 12px;font-size:.85rem}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#06281a!important}
.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;margin:4px 0 14px}
input[type=color]{padding:3px;height:44px}
textarea{resize:vertical}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.85rem;tab-size:2;white-space:pre;overflow-x:auto}
label{font-size:.9rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.f1{flex:1;min-width:180px}
.mut{color:var(--mut);font-size:.88rem}
.won{color:var(--warn);font-weight:600}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--c,#888);color:var(--c,#888);white-space:nowrap}
.av{width:var(--s,48px);height:var(--s,48px);border-radius:50%;object-fit:cover;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--sec));font-weight:600;color:#fff;font-size:calc(var(--s,48px)*.4)}
.hero{text-align:center;padding:40px 20px 20px}
.hero h1{font-size:2.4rem;margin:0;background:linear-gradient(90deg,var(--pri),var(--sec));-webkit-background-clip:text;background-clip:text;color:transparent}
.rules{background:#2a1f12;border-left:4px solid var(--warn);padding:12px 16px;border-radius:8px}
.bar{position:relative;height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--sec))}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--warn)}
.stat{display:grid;grid-template-columns:105px 1fr 34px;gap:10px;align-items:center;margin:7px 0}
.radar{max-width:100%;height:auto}
.radar text{fill:var(--mut);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs a{padding:6px 14px;border-radius:10px;background:var(--card);color:var(--txt);border:1px solid var(--line);font-size:.9rem}
.tabs a.on{background:var(--pri);border-color:var(--pri)}
.item{display:block;color:var(--txt);transition:.2s}.item:hover{border-color:var(--pri)}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chk label{display:flex;gap:6px;align-items:center;background:var(--card2);padding:6px 12px;border-radius:8px;color:var(--txt);cursor:pointer}
.chk input{width:auto;margin:0}
.cf{width:100%;border:0;display:block;height:40px;background:transparent}
.preview{border:1px dashed var(--pri);border-radius:10px;padding:12px;margin-top:12px}
details{margin:6px 0 14px;background:var(--card2);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}

/* ---------- เนื้อหาโพสต์ ---------- */
.rich{font-family:'Prompt','Noto Sans Thai','Sarabun',sans-serif;line-height:1.75;word-wrap:break-word}
.rich p{margin:0 0 .6em}
.rich img{max-width:100%;border-radius:8px}
.rich h2,.rich h3{margin:.4em 0}
.rich blockquote{border-left:3px solid var(--sec);margin:10px 0;padding:6px 14px;background:color-mix(in srgb,var(--sec) 10%,transparent);border-radius:0 8px 8px 0}
.rich details{background:var(--card2);padding:8px 12px;border-radius:8px;margin:8px 0}
.rich summary{color:var(--warn)}
.rich iframe{max-width:100%;border-radius:10px;border:0}
.rich hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.rich pre{background:var(--card2);padding:10px;border-radius:8px;overflow:auto}

/* ---------- กล่องเขียนข้อความ ---------- */
.ed{border:1px solid var(--line);border-radius:12px;background:var(--card2);margin:6px 0 14px;overflow:hidden}
.ed:focus-within{border-color:var(--pri)}
.ed [hidden]{display:none!important}
.ed-tabs{display:flex;gap:2px;align-items:flex-end;padding:6px 8px 0;background:var(--card)}
.ed-tabs button{background:transparent;border:0;color:var(--mut);font:inherit;font-size:.85rem;padding:7px 14px;border-radius:9px 9px 0 0;cursor:pointer}
.ed-tabs button.on{background:var(--card2);color:var(--txt);font-weight:600}
.ed-count{margin-left:auto;font-size:.78rem;color:var(--mut);padding:0 6px 6px}
.ed-bar{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:5px 6px;border-bottom:1px solid var(--line);position:sticky;top:58px;background:var(--card2);z-index:3}.ed-bar .ed-g{display:flex;align-items:center;gap:2px;padding-right:5px;margin-right:2px;border-right:1px solid var(--line)}.ed-bar .ed-g:last-child{border-right:0}.ed-bar button,.ed-c{height:30px;min-width:30px;padding:0 6px}.ed-bar select{height:30px;max-width:150px}.ed-area{min-height:360px;max-height:75vh;overflow:auto;padding:18px;outline:0}
.ed-area .html-source-block{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--txt);font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.ed-area .html-source-block code{font:inherit;white-space:inherit}
.ed-g{display:flex;gap:2px;align-items:center;padding-right:6px;border-right:1px solid var(--line)}
.ed-g:last-child{border:0}
.ed-bar button,.ed-c{height:32px;min-width:32px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--txt);font:inherit;font-size:.88rem;cursor:pointer;display:inline-grid;place-items:center;padding:0 7px;margin:0}
.ed-bar button:hover,.ed-c:hover{background:var(--line)}
.ed-bar select{height:32px;width:auto;margin:0;padding:0 6px;font-size:.82rem;background:var(--card);border-radius:7px}
.ed-c{position:relative;overflow:hidden}
.ed-c input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;margin:0;padding:0}
.ed-area{min-height:220px;max-height:65vh;overflow:auto;padding:14px 16px;outline:0}
.ed-area:empty:before{content:attr(data-ph);color:var(--mut);pointer-events:none}
.ed textarea{border:0;border-radius:0;margin:0;min-height:240px;background:#120f22}
.ed-foot{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;font-size:.76rem;color:var(--mut);border-top:1px solid var(--line);background:var(--card)}
.seg{display:flex;gap:3px;background:var(--card2);padding:3px;border-radius:99px;border:1px solid var(--line)}
.seg input{display:none}
.seg span{display:block;padding:4px 14px;border-radius:99px;cursor:pointer;font-size:.85rem;color:var(--txt)}
.seg input:checked+span{background:var(--pri);color:#fff}
.as-card{display:flex;gap:10px;align-items:center;background:var(--card2);padding:8px 12px;border-radius:12px;margin:12px 0}

/* ---------- หน้าโปรไฟล์ตามโครงสร้างที่วาด ---------- */
.profile-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:20px}
.profile-banner{position:relative;height:240px;background:linear-gradient(135deg,var(--sec),var(--pri));overflow:hidden}
.profile-banner img{width:100%;height:100%;object-fit:cover}
.profile-avatar-row{position:relative;display:flex;justify-content:center;margin-top:-60px;margin-bottom:12px}
.profile-avatar-row .av{width:120px;height:120px;border:4px solid var(--card);box-shadow:0 8px 24px #0008;font-size:42px}
.profile-info{text-align:center;padding:0 20px 20px;border-bottom:1px solid var(--line)}
.profile-info h2{margin:0 0 4px;font-size:1.8rem}
.profile-main-layout{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px;align-items:start}
.profile-custom-code-output{width:100%;min-width:0;margin:0 0 16px;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;overflow:visible}
.profile-custom-code-output iframe{display:block;width:100%;max-width:100%;margin:0;border:0;background:transparent}
@media(max-width:850px){.profile-main-layout{grid-template-columns:1fr}}

/* ---------- ดีไซน์บอร์ดแบบ Pro (เหมือนในภาพตัวอย่าง) ---------- */
.cat-block{margin-bottom:28px}
.cat-header{font-size:1.2rem;font-weight:600;margin-bottom:12px;color:var(--txt);display:flex;align-items:center;gap:8px}
.forum-pro-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;display:grid;grid-template-columns:320px 1fr 280px;align-items:stretch;transition:.2s}
.forum-pro-card:hover{border-color:var(--pri)}
@media(max-width:900px){.forum-pro-card{grid-template-columns:1fr}}

.forum-pro-banner{position:relative;min-height:120px;background:var(--card2);background-size:${f.bannerFit==='contain'?'contain':'cover'};background-position:${['center','top','bottom','left','right'].includes(f.bannerPosition)?f.bannerPosition:'center'}}
.forum-pro-banner .overlay{position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,var(--card));}
@media(max-width:900px){.forum-pro-banner .overlay{background:linear-gradient(0deg,var(--card),transparent)}}

.forum-pro-main{padding:16px 20px;display:flex;flex-direction:column;justify-content:center}
.forum-pro-main h3{margin:0 0 6px;font-size:1.15rem}
.forum-sub-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.forum-sub-badge{background:var(--card2);border:1px solid var(--line);padding:2px 10px;border-radius:99px;font-size:.78rem;color:var(--mut);transition:.2s}
.forum-sub-badge:hover{border-color:var(--pri);color:var(--txt)}

.forum-pro-stats{display:flex;align-items:center;justify-content:space-around;padding:16px;background:color-mix(in srgb,var(--card2) 50%,transparent);border-left:1px solid var(--line);font-size:.85rem}
.forum-pro-stats div{text-align:center}
.forum-pro-stats b{display:block;font-size:1.1rem;color:var(--pri)}
@media(max-width:900px){.forum-pro-stats{border-left:0;border-top:1px solid var(--line)}}

.forum-pro-last{padding:14px 18px;border-left:1px solid var(--line);font-size:.82rem;display:flex;flex-direction:column;justify-content:center;background:color-mix(in srgb,var(--card2) 30%,transparent)}
@media(max-width:900px){.forum-pro-last{border-left:0;border-top:1px solid var(--line)}}

/* ---------- รูปข้างแบบยาว ---------- */
.post-layout{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.side{--ac:var(--pri);background:var(--card2);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:72px}
.side-por{position:relative;aspect-ratio:3/5;min-height:420px;max-height:620px;background:linear-gradient(160deg,var(--ac),var(--sec));overflow:hidden}
.side-por .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:4.5rem;font-weight:600;color:#fff9}
.side-por img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.side-por:hover img{transform:scale(1.05)}
.side-name{position:absolute;left:0;right:0;top:0;padding:14px 10px 46px;text-align:center;background:linear-gradient(#000d,transparent)}
.side-name small{display:block;font-size:.62rem;letter-spacing:3px;opacity:.85}
.side-name b{display:block;font-size:1.3rem;color:var(--ac);text-shadow:0 2px 10px #000;line-height:1.25}
.side-name span{font-size:.78rem;opacity:.9}
.side-hover{position:absolute;left:0;right:0;bottom:0;padding:40px 10px 14px;text-align:center;font-size:.85rem;background:linear-gradient(transparent,#000e);opacity:0;transition:.3s}
.side-por:hover .side-hover{opacity:1}
.side-body{padding:12px;display:grid;gap:10px;text-align:center}
.side-btn{display:block;padding:6px;border:1px solid var(--ac);border-radius:99px;color:var(--txt);font-size:.85rem;transition:.2s}
.side-btn:hover{background:var(--ac);color:#fff}
.side-row{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.side-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.side-stats div{background:var(--card);border-radius:8px;padding:4px}
.side-stats b{display:block;font-size:.95rem}
.side-stats small{font-size:.68rem;color:var(--mut)}
.side-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.side-box-t{font-size:.75rem;color:var(--mut);margin-bottom:6px;letter-spacing:.5px}
.side-box img{width:100%;border-radius:8px;display:block;margin-bottom:4px}
.side-box b{font-size:.85rem}
.post.gm{border-color:var(--warn)}
.post-top{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.edit-grid{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
@media(max-width:820px){.post-layout,.edit-grid{grid-template-columns:1fr}.side{position:static;max-width:280px;margin:0 auto;width:100%}}

/* ---------- ร้านค้า ---------- */
.recent-box{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);background:var(--card);border-radius:10px;margin-bottom:8px}
.shop-item{text-align:center;display:flex;flex-direction:column;gap:6px}
.shop-item .pic{aspect-ratio:1;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:3rem;overflow:hidden}
.shop-item .pic img{width:100%;height:100%;object-fit:cover}

#dlg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:100;padding:16px}
#dlg[hidden]{display:none}
.dlg-box{max-width:440px;width:100%;margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;background:var(--ok);color:#06281a;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:90%}
#toast.show{opacity:1}#toast.bad{background:var(--bad);color:#fff}

/* ================= UX/UI REFRESH 2026 ================= */
:root{--bg:#0b0914;--card:#14111f;--card2:#1d192c;--line:#302941;--pri:#d6a7ff;--sec:#998ba5;--txt:#f4eff9;--mut:#aaa0b8;--ok:#70d6b0;--warn:#f0ca84;--bad:#f28c9d;--radius:16px}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{line-height:1.65;font-size:15px;background:radial-gradient(ellipse at 15% -10%,#29203e 0,transparent 42%),radial-gradient(ellipse at 100% 0,#1a1428 0,transparent 36%),var(--bg)}
nav{padding:12px clamp(14px,3vw,32px);gap:14px;background:rgba(11,9,20,.92);border-bottom:1px solid rgba(214,167,255,.14);box-shadow:0 8px 28px #0002}
.logo{font-size:1.15rem;letter-spacing:.2px;white-space:nowrap}
.links{gap:6px 10px}
.links>a:not(.btn):not(.row){padding:8px 10px;border-radius:9px;color:var(--mut);transition:background .18s,color .18s}
.links>a:not(.btn):not(.row):hover,.links>a:not(.btn):not(.row):focus-visible{background:var(--card2);color:var(--txt)}
main{width:min(100%,1180px);padding:clamp(16px,3vw,30px) clamp(12px,2.4vw,24px) 72px}
h1,h2,h3,h4{line-height:1.3;letter-spacing:-.02em}
h2{font-size:clamp(1.25rem,2.5vw,1.65rem);margin-bottom:18px}
h3{font-size:1.08rem}
.card{padding:clamp(15px,2.3vw,24px);border-radius:var(--radius);border-color:rgba(170,150,198,.16);background:linear-gradient(145deg,rgba(25,21,38,.98),rgba(19,16,29,.98));box-shadow:0 10px 30px #00000012;transition:border-color .2s,transform .2s}
.grid{gap:16px}
.btn{padding:10px 17px;border-radius:11px;background:linear-gradient(120deg,#b88bd8,#8f82bd);box-shadow:0 4px 12px #0002;transition:transform .16s,filter .16s,box-shadow .16s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 7px 18px #0003}
.btn:active{transform:translateY(0)}
.btn.ghost{box-shadow:none;background:rgba(255,255,255,.025);border-color:var(--line)}
input,select,textarea{border-radius:11px;border-color:#393149;background:#171321;min-height:43px;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{border-color:var(--sec);box-shadow:0 0 0 3px #998ba526}
textarea{min-height:110px}
label{display:inline-block;margin-bottom:3px}
table{border-spacing:0;overflow:hidden;border-radius:10px}
th{font-size:.82rem;color:var(--mut);font-weight:600;background:#ffffff05}
th,td{padding:11px 12px;border-bottom:1px solid rgba(170,150,198,.12)}
tr:last-child td{border-bottom:0}
.tabs{gap:8px;margin-bottom:18px}
.tabs a{padding:8px 14px;border-radius:999px;background:var(--card);border-color:rgba(170,150,198,.16)}
.tabs a.on{background:var(--sec);border-color:var(--sec);color:#fff}
.badge{padding:3px 10px}
.me-pill{padding:4px 12px 4px 4px}
#toast{bottom:max(18px,env(safe-area-inset-bottom));border-radius:12px;box-shadow:0 10px 30px #0004}
#dlg{backdrop-filter:blur(5px)}
.dlg-box{border-radius:16px}
a:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:3px}
::selection{background:#998ba566;color:#fff}
@media(max-width:900px){
 nav{align-items:flex-start;flex-direction:column;padding:10px 14px}
 .links{width:100%;gap:5px;overflow-x:auto;flex-wrap:nowrap;padding:2px 0 5px;scrollbar-width:thin}
 .links>a{flex:0 0 auto}
 .me-pill{flex:0 0 auto}
 main{padding-top:18px}
}
@media(max-width:600px){
 body{font-size:14px}
 nav{position:sticky;top:0}
 .logo{font-size:1.05rem}
 .links a:not(.btn):not(.row){padding:7px 9px;font-size:.86rem}
 .card{padding:15px;border-radius:13px;margin-bottom:12px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,145px),1fr));gap:10px}
 .row{gap:8px}
 .f1{min-width:100%}
 table{display:block;overflow-x:auto;white-space:nowrap}
 .edit-grid{grid-template-columns:minmax(0,1fr)}
 .hero{padding:26px 12px 16px}
 .hero h1{font-size:clamp(1.7rem,8vw,2.2rem)}
 input,select,textarea{font-size:16px}
 .btn{padding:9px 13px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}


/* STARLIGHT home experience */
.home-hero{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(220px,.8fr);align-items:center;gap:20px;min-height:360px;margin:4px 0 24px;padding:clamp(26px,5vw,58px);border:1px solid #b9a0d51c;border-radius:24px;background:linear-gradient(115deg,#171321f7 0%,#21182df0 58%,#2a2038e8 100%);box-shadow:0 20px 55px #0002}
.home-hero:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background-image:radial-gradient(#e9d8ff 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(90deg,transparent,#000)}
.home-hero-glow{position:absolute;z-index:-1;width:360px;height:360px;border-radius:50%;right:7%;top:-58%;background:#998ba533;filter:blur(18px)}
.home-hero-content{position:relative;z-index:2}
.home-eyebrow,.home-kicker{font-size:.7rem;letter-spacing:.19em;color:#c9b6dc;font-weight:600}
.home-eyebrow{display:flex;align-items:center;gap:9px}
.home-eyebrow span{width:6px;height:6px;border-radius:50%;background:#d6a7ff;box-shadow:0 0 12px #d6a7ff}
.home-hero h1{font-size:clamp(2rem,5vw,3.35rem);margin:17px 0 8px;line-height:1.12;letter-spacing:-.04em}
.home-hero h1 em{font-style:normal;background:linear-gradient(110deg,#f1dfff,#bca4d9 65%,#998ba5);color:transparent;background-clip:text;-webkit-background-clip:text}
.home-hero-content>p{color:#b8adc6;max-width:520px;margin:0;font-size:1rem}
.home-hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.home-hero-actions .btn{display:inline-flex;align-items:center;gap:12px}
.home-hero-actions .btn.ghost{border-color:#c8b6df35;color:#e8dff1!important}
.home-stats{display:flex;align-items:center;gap:22px;margin-top:30px}
.home-stats div{display:grid;gap:0}.home-stats b{font-size:1.2rem;line-height:1.3;color:#f5eaff}.home-stats span{font-size:.75rem;color:#a99bb9}
.home-stats i{height:27px;width:1px;background:#c8b6df30}
.home-hero-orbit{position:relative;justify-self:center;width:min(100%,280px);aspect-ratio:1;display:grid;place-items:center}
.orbit-ring{position:absolute;border:1px solid #c6acd83d;border-radius:50%;inset:8%;transform:rotate(-24deg)}
.ring-one{border-style:dashed;animation:starOrbit 45s linear infinite}
.ring-two{inset:22%;border-color:#c6acd84d;transform:rotate(25deg)}
.orbit-star{font-size:clamp(5rem,11vw,8rem);color:#e6d3f7;text-shadow:0 0 24px #c3a0e477,0 0 70px #a78bc544;animation:starPulse 4s ease-in-out infinite}
.orbit-label{position:absolute;font-size:.61rem;letter-spacing:.2em;color:#c9b6dc;background:#21182de8;border:1px solid #c6acd82b;border-radius:99px;padding:5px 9px}
.label-one{top:13%;left:0}.label-two{right:-2%;top:48%}.label-three{bottom:12%;left:17%}
@keyframes starOrbit{to{transform:rotate(336deg)}}@keyframes starPulse{50%{transform:scale(1.07);text-shadow:0 0 34px #c3a0e4aa,0 0 80px #a78bc577}}
.home-quicklinks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 42px}
.home-quicklinks>a{min-width:0;display:flex;align-items:center;gap:12px;padding:15px 14px;border:1px solid #b9a0d51b;border-radius:15px;background:#171321b8;color:var(--txt);transition:transform .2s,border-color .2s,background .2s}

.home-quicklinks>a>span:nth-child(2){display:grid;min-width:0}.home-quicklinks b{font-size:.9rem}.home-quicklinks small{font-size:.72rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.home-section{margin:0 0 42px}

.home-text-link{flex:0 0 auto;font-size:.85rem;color:#cdb5e4;padding-bottom:4px}
.home-recent-list{display:grid;gap:8px}

.home-recent:hover{background:#211a2e;border-color:#b9a0d555;transform:translateX(2px)}
.home-recent-icon{flex:0 0 35px;width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:#998ba51b;color:#cbb0e6}
.home-recent-main{flex:1;min-width:0}.home-recent-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.home-recent-title b{overflow-wrap:anywhere}
.home-recent-meta{font-size:.77rem;margin-top:4px}
.home-replies{flex:0 0 auto;display:grid;text-align:center;min-width:48px}.home-replies b{font-size:1rem;color:#e1c8f8}.home-replies span{font-size:.68rem;color:var(--mut)}
.home-empty{padding:28px;text-align:center;border:1px dashed #b9a0d533;border-radius:15px;color:var(--mut)}.home-empty>span{display:block;font-size:1.8rem;color:#cbb0e6}.home-empty p{margin:4px 0 14px}
.home-forums{display:grid;gap:18px}.home-forums .cat-block{margin:0}.home-forums .cat-header{display:flex;align-items:center;gap:9px;font-size:.95rem;font-weight:600;margin:0 0 10px;padding:0 0 10px;border-bottom:1px solid #b9a0d51b}
.home-cat-mark{color:#c7a7e4}.home-forums .forum-pro-card{border-radius:14px;overflow:hidden;margin-bottom:10px;border-color:#b9a0d51c;background:#171321b8}
.home-forums .forum-pro-banner{min-height:78px;position:relative;background-color:#272033;background-size:cover;background-position:center}
.home-forums .forum-pro-banner .overlay{position:absolute;inset:0;background:linear-gradient(90deg,#16111f77,#16111f11)}
.home-forum-star{position:absolute;right:18px;top:12px;color:#ead8ff;font-size:1.2rem;text-shadow:0 0 15px #d6a7ff}
.home-forums .forum-pro-main{padding:14px 16px}.home-forums .forum-pro-stats{padding:0 16px 12px;display:flex;gap:18px;font-size:.78rem;color:var(--mut)}.home-forums .forum-pro-stats b{color:#e5d3f4;margin-right:4px}
.home-forums .forum-pro-last{padding:10px 16px;border-top:1px solid #b9a0d51b;background:#ffffff03}
.home-forums .forum-sub-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.home-forums .forum-sub-badge{border:1px solid #b9a0d523;border-radius:99px;padding:3px 9px;font-size:.75rem;color:#c9b6dc}
.home-custom-content{padding:0;overflow:hidden}.home-custom-content iframe{width:100%;border:0;display:block}
@media(max-width:820px){.home-hero{grid-template-columns:minmax(0,1fr) 190px;gap:10px;padding:28px}.home-hero-orbit{width:190px}.home-quicklinks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.home-hero{grid-template-columns:1fr;min-height:0;padding:26px 20px;border-radius:18px}.home-hero-orbit{position:absolute;right:-60px;top:4px;width:170px;opacity:.28;pointer-events:none}.home-hero-content{max-width:100%}.home-hero h1{font-size:2rem;overflow-wrap:anywhere}.home-hero-content>p{max-width:90%;font-size:.9rem}.home-hero-actions{margin-top:18px}.home-stats{gap:15px;margin-top:23px}.home-quicklinks{gap:8px;margin-bottom:32px}.home-quicklinks>a{padding:11px 9px;gap:8px}.quick-icon{width:32px;height:32px;flex-basis:32px}.home-quicklinks small{white-space:normal;line-height:1.35}.home-section{margin-bottom:32px}.home-section-heading{align-items:flex-start}.home-section-heading h2{font-size:1.35rem}.home-section-heading p{font-size:.8rem}.home-text-link{font-size:.75rem}.home-recent{padding:11px 10px;gap:9px}.home-recent-icon{width:30px;flex-basis:30px;height:30px}.home-recent-title{gap:5px}.home-recent-title b{font-size:.86rem}.home-recent-meta{font-size:.7rem}.home-replies{min-width:37px}.home-replies span{font-size:.62rem}}

const store=(()=>{try{const s=window.localStorage;s.setItem('sa__t','1');s.removeItem('sa__t');return s}catch(e){const m={};return{temp:true,getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
/* ================= CLOUD SYNC ================= */
const SUPABASE_URL='https://pmsueityhjuvkaeviixi.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_EQwQb-Yj2EBLqQNdzV5aSA_dv4Cp4Ma';
const CLOUD_COLLECTIONS=['users','characters','posts','threads','forums','categories','settings','items','agencies','groups'];
const CLOUD_AUTH_DOMAIN='starlight.invalid';
let supaClient=null, cloudProfile=null, cloudReady=false, cloudApplying=false, cloudQueue=Promise.resolve(), cloudChannel=null;
let cloudFirstAdminUsername=null;
let forumOrderSyncInProgress=false, cloudSyncErrorVersion=0;
let MAIL_CACHE={ownerId:'',inbox:[],sent:[],loaded:{},loading:{},error:{}};
try{
 if(window.supabase&&typeof window.supabase.createClient==='function'){
  supaClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 }
}catch(e){console.error('Supabase client initialization failed',e)}
function cloudAuthEmail(username){return String(username||'').trim().toLowerCase()+'@'+CLOUD_AUTH_DOMAIN}
function cloudPublicPayload(collection,row){
 if(collection!=='users'||!row||typeof row!=='object')return row;
 const clean={...row};delete clean.pass;return clean;
}
function cloudParse(raw, fallback){
 try{return raw===null?fallback:JSON.parse(raw)}catch(e){return fallback}
}
function cloudRowMap(collection,value){
 if(collection==='settings')return new Map([['__singleton__',value||{}]]);
 return new Map((Array.isArray(value)?value:[]).filter(x=>x&&x.id!=null).map(x=>[String(x.id),cloudPublicPayload(collection,x)]));
}
function cloudSyncCollection(collection,oldValue,newValue){
 if(!supaClient||!cloudReady||cloudApplying||!CLOUD_COLLECTIONS.includes(collection))return;
 const isObject=collection==='settings';
 const oldMap=cloudRowMap(collection,oldValue),newMap=cloudRowMap(collection,newValue),ops=[];
 for(const [id] of oldMap)if(!newMap.has(id))ops.push({p_collection:collection,p_record_id:id,p_payload:null,p_delete:true});
 for(const [id,row] of newMap){
  const old=oldMap.get(id);
  if(JSON.stringify(old)!==JSON.stringify(row))ops.push({p_collection:collection,p_record_id:id,p_payload:row,p_delete:false});
 }
 if(!ops.length)return;
 cloudQueue=cloudQueue.then(async()=>{
  for(const args of ops){
   if(!cloudReady)return;
   const {error}=await supaClient.rpc('site_record_write',args);
   if(error)throw error;
  }
 }).catch(err=>{
  cloudSyncErrorVersion++;
  console.error('Cloud sync failed for '+collection,err);
  toast('ซิงก์ข้อมูลไม่สำเร็จ: '+(err?.message||'ตรวจสอบสิทธิ์/ฐานข้อมูล'),'bad');
 });
}
async function cloudFetchRows(){
 const {data,error}=await supaClient.from('site_records').select('collection,record_id,payload');
 if(error)throw error;
 return data||[];
}
function cloudApplyRows(rows,preserveLocalPasswords=true){
 const grouped=Object.fromEntries(CLOUD_COLLECTIONS.filter(k=>k!=='settings').map(k=>[k,[]]));
 let settings=null;
 for(const r of rows||[]){
  if(r.collection==='settings'&&r.record_id==='__singleton__'){settings=r.payload;continue}
  if(grouped[r.collection])grouped[r.collection].push(r.payload);
 }
 const oldUsers=cloudParse(store.getItem('sa_users'),[]);
 const passById=new Map((Array.isArray(oldUsers)?oldUsers:[]).filter(u=>u&&u.id&&u.pass).map(u=>[String(u.id),u.pass]));
 cloudApplying=true;
 try{
  for(const collection of CLOUD_COLLECTIONS){
   if(collection==='settings'){
    if(settings)store.setItem('sa_settings',JSON.stringify(settings));
    continue;
   }
   let value=grouped[collection]||[];
   if(collection==='users')value=value.map(u=>preserveLocalPasswords&&passById.has(String(u.id))?{...u,pass:passById.get(String(u.id))}:u);
   store.setItem('sa_'+collection,JSON.stringify(value));
  }
 }finally{cloudApplying=false}
}
async function cloudGetProfile(){
 const {data:{user},error:userError}=await supaClient.auth.getUser();
 if(userError)throw userError;
 if(!user)return null;
 const {data,error}=await supaClient.from('site_profiles').select('auth_user_id,app_user_id,username,role').eq('auth_user_id',user.id).maybeSingle();
 if(error)throw error;
 return data||null;
}
async function cloudPreflight(){
 if(!supaClient)return false;
 try{
  // site_profiles is intentionally hidden from anonymous users by RLS; checking it
  // before authentication would always fail. site_records is the public schema probe.
  const {error}=await supaClient.from('site_records').select('record_id').limit(1);
  if(error){toast('ต้องติดตั้งฐานข้อมูลก่อน: เปิด supabase/setup.sql ใน GitHub แล้วรันใน Supabase → SQL Editor ('+(error.message||'ตารางยังไม่พร้อม')+')','bad');return false}
  return true;
 }catch(err){toast('เชื่อม Supabase ไม่ได้: '+(err?.message||String(err)),'bad');return false}
}
async function cloudImportLocalSnapshot(){
 const snapshot={};
 for(const collection of CLOUD_COLLECTIONS){
  const value=cloudParse(store.getItem('sa_'+collection),collection==='settings'?{}:[]);
  snapshot[collection]=collection==='users'&&Array.isArray(value)?value.map(u=>cloudPublicPayload('users',u)):value;
 }
 const {data,error}=await supaClient.rpc('site_import_local_snapshot',{p_snapshot:snapshot});
 if(error)throw error;
 return data;
}
async function cloudFirstAdminNeeded(){
 if(!supaClient)return false;
 const {data,error}=await supaClient.rpc('site_first_admin_needed');
 if(error)throw error;
 return data===true;
}
async function cloudLoadForCurrentSession({allowImport=true}={}){
 const profile=await cloudGetProfile();
 if(!profile)throw new Error('ไม่พบโปรไฟล์ Cloud ของบัญชีนี้ กรุณาตรวจสอบว่าได้รัน supabase/setup.sql แล้ว');
 cloudProfile=profile;
 store.setItem('sa_session',profile.app_user_id);
 let rows=await cloudFetchRows();
 if(rows.length===0&&allowImport&&profile.role==='admin'){
  await cloudImportLocalSnapshot();
  rows=await cloudFetchRows();
 }
 if(rows.length){
  cloudApplyRows(rows,true);
  cloudReady=true;
  cloudFirstAdminUsername=null;
  cloudSubscribe();
 }else{
  cloudReady=false;
  if(profile.role!=='admin'){
   try{cloudFirstAdminUsername=await cloudFirstAdminNeeded()?profile.username:null}
   catch(e){console.warn('Unable to check initial admin state',e)}
  }else cloudFirstAdminUsername=null;
 }
 return {profile,rows};
}
function cloudHasActiveEditingWork(){
 const appRoot=document.getElementById('app'),active=document.activeElement;
 const route=String(ROUTE||'').split('/')[0];
 // Do not replace an edit form while someone is actively editing it.
 const editRoutes=new Set(['editpost','editthread','editagency','editgroup','editchar','editbio','newthreadtoforum','newbio','newchar','register','settings']);
 if(editRoutes.has(route))return true;
 // Toolbars/buttons can take focus away from the field; protect the entire editor.
 if(active&&active.closest&&active.closest('#app .ed, #app .topic-composer, #app .reply-composer, #app .char-edit-form, #app .char-bio-editor, #app [data-preserve-on-cloud-refresh]'))return true;
 if(active&&appRoot&&appRoot.contains(active)&&active.matches('input,textarea,select,[contenteditable="true"]'))return true;
 return false;
}
async function cloudRefresh(renderAfter=true){
 // A forum reorder updates several records; do not let realtime refresh restore a half-written order.
 if(!supaClient||!cloudReady||cloudApplying||forumOrderSyncInProgress)return;
 try{
  const rows=await cloudFetchRows();
  if(!rows.length)return;
  cloudApplyRows(rows,true);
  if(renderAfter&&!cloudHasActiveEditingWork())render();
 }catch(e){console.warn('Cloud refresh failed',e)}
}
function cloudSubscribe(){
 if(!supaClient||cloudChannel)return;
 cloudChannel=supaClient.channel('starlight-site-records')
  .on('postgres_changes',{event:'*',schema:'public',table:'site_records'},()=>cloudRefresh())
  .subscribe();
}
async function cloudBootstrap(){
 if(!supaClient)return;
 try{
  const {data:{session},error}=await supaClient.auth.getSession();
  if(error)throw error;
  if(session){
   await cloudLoadForCurrentSession({allowImport:true});
   return;
  }
  // Public site content may be read without signing in; all writes still require Supabase Auth.
  const rows=await cloudFetchRows();
  if(rows.length)cloudApplyRows(rows,true);
  // Once the cloud schema is installed, require a Supabase Auth session;
  // never display a browser-only legacy session as though it were cloud-authenticated.
  store.removeItem('sa_session');
 }catch(e){
  console.warn('Cloud sync is not ready yet; keeping local data',e);
 }
}
async function cloudCompleteAuth(authUser){
 const {profile}=await cloudLoadForCurrentSession({allowImport:true});
 return profile;
}

function validThemeHex(v){return typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v)}
function themeLuminance(hex){
 if(!validThemeHex(hex))return 0;
 const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));
 return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];
}
function getSavedPersonalTheme(){
 try{const t=JSON.parse(store.getItem('sa_personal_theme')||'null');if(t&&validThemeHex(t.pri)&&validThemeHex(t.sec)&&validThemeHex(t.bg))return{pri:t.pri,sec:t.sec,bg:t.bg}}catch(e){}
 return null;
}
function applyPersonalTheme(theme){
 const r=document.documentElement.style;
 if(!theme||!validThemeHex(theme.pri)||!validThemeHex(theme.sec)||!validThemeHex(theme.bg)){
  document.body.classList.remove('personal-theme-active');
  ['--card','--card2','--line','--txt','--mut','--theme-btn-text'].forEach(k=>r.removeProperty(k));
  if(S){r.setProperty('--pri',S.pri);r.setProperty('--sec',S.sec);r.setProperty('--bg',S.bg)}
  return;
 }
 const light=themeLuminance(theme.bg)>.48;
 const btnText=themeLuminance(theme.pri)>.46?'#241d2b':'#ffffff';
 r.setProperty('--pri',theme.pri);r.setProperty('--sec',theme.sec);r.setProperty('--bg',theme.bg);
 r.setProperty('--card',light?'color-mix(in srgb, '+theme.bg+' 95%, #000000 5%)':'color-mix(in srgb, '+theme.bg+' 88%, #ffffff 12%)');
 r.setProperty('--card2',light?'color-mix(in srgb, '+theme.bg+' 90%, #000000 10%)':'color-mix(in srgb, '+theme.bg+' 80%, '+theme.sec+' 20%)');
 r.setProperty('--line','color-mix(in srgb, '+theme.bg+' 68%, '+theme.sec+' 32%)');
 r.setProperty('--txt',light?'#2b2632':'#f4eff9');
 r.setProperty('--mut',light?'#71687c':'#aaa0b8');
 r.setProperty('--theme-btn-text',btnText);
 document.body.classList.add('personal-theme-active');
}

async function hash(s){
 try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 let h1=0xdeadbeef,h2=0x41c6ce57;for(const ch of String(s)){const c=ch.codePointAt(0);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
 return 'f'+(h2>>>0).toString(16)+(h1>>>0).toString(16);
}

function dialog(msg,input){

  const d=document.getElementById('dlg'),isIn=input!==undefined;if(!d)return res(isIn?null:false);
  d.innerHTML=`<div class="card dlg-box"><p style="white-space:pre-wrap;margin-top:0">${esc(msg)}</p>${isIn?`<input id="dlgIn" value="${esc(input)}">`:''}

  d.hidden=false;const inp=document.getElementById('dlgIn');
  const close=v=>{d.hidden=true;d.innerHTML='';res(v)};
  const btnNo=document.getElementById('dlgNo');if(btnNo)btnNo.onclick=()=>close(isIn?null:false);
  const btnOk=document.getElementById('dlgOk');if(btnOk)btnOk.onclick=()=>close(isIn?inp.value:true);
  if(inp){inp.focus();inp.select();inp.onkeydown=e=>{if(e.key==='Enter')close(inp.value)}}else if(btnOk)btnOk.focus();
 });
}

function onCharacterStudioImageChange(input){
 const ed=input?.closest('.char-bio-editor'),key=input?.dataset.studioImageFile,file=input?.files?.[0];
 if(!ed||!key||!file)return;
 if(!file.type.startsWith('image/')){toast('กรุณาเลือกไฟล์รูปภาพ');input.value='';return}
 if(file.size>12*1024*1024){toast('ไฟล์ใหญ่เกินไป กรุณาเลือกรูปไม่เกิน 12 MB');input.value='';return}
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const draw=(limit,quality)=>{
    const ratio=Math.min(1,limit/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));
    const ctx=canvas.getContext('2d');ctx.fillStyle='#f2ede3';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',quality);
   };
   let data=draw(1200,.78);if(data.length>700000)data=draw(900,.66);
   const hidden=ed.querySelector('[data-studio-image-value="'+key+'"]');
   const preview=ed.querySelector('[data-studio-image="'+key+'"] .char-bio-studio-image-shown');
   const empty=ed.querySelector('[data-studio-image="'+key+'"] .char-bio-studio-image-empty');
   if(hidden)hidden.value=data;
   if(preview){preview.src=data;preview.style.display='block'}
   if(empty)empty.style.display='none';
   toast('รูปพร้อมแล้ว — กด “สร้างโค้ดและพรีวิว” เพื่อใส่ลงโปรไฟล์');
  };
  img.onerror=()=>toast('อ่านรูปนี้ไม่ได้ กรุณาลองไฟล์อื่น');
  img.src=String(reader.result||'');
 };
 reader.onerror=()=>toast('อ่านไฟล์รูปไม่สำเร็จ');
 reader.readAsDataURL(file);
}
function characterStudioReadData(html){

  if(node.parentElement?.closest('pre,code,script,style'))continue;

  frag.innerHTML=sanitize(raw);
  if(!frag.content.childNodes.length)continue;
  node.replaceWith(frag.content.cloneNode(true));changed=true;
 }

 const source=area?('value'in area?area.value:area.textContent):'';
 const n=area?(t==='charcode'?String(source||'').length:textLen(source,ed.dataset.htmlSource==='1'?'html':t==='rich'?'rich':'html')):0;
 const cnt=ed.querySelector('.ed-count');if(cnt)cnt.textContent=n.toLocaleString()+' ตัวอักษร';

const EDITOR_VISUAL_DRAFT_PREFIX='__STARLIGHT_VISUAL_HTML_V1__:';
function decodeEditorHtmlEntities(value){
 return String(value||'').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'").replace(/&amp;/gi,'&');
}
function getEditorHtmlSource(value){
 let source=String(value||'').replace(/^\uFEFF/,'').trim();
 source=source.replace(/^\x60{3,}(?:html|xml|xhtml)?\s*/i,'').replace(/\s*\x60{3,}$/,'').trim();
 const candidates=[source];
 if(/&lt;\s*\/?\s*(?:html|head|body|div|section|article|main|header|footer|table|p|span|h[1-6]|ul|ol|li|a|img|br|hr|style|center|blockquote|font|figure|details)\b/i.test(source))candidates.push(decodeEditorHtmlEntities(source));
 const starts=/^\s*(?:(?:<!--[\s\S]*?-->)\s*)*(?:<!doctype\s+html\b|<(?:html|head|body|div|section|article|main|header|footer|table|thead|tbody|tr|td|th|p|span|h[1-6]|ul|ol|li|a|img|br|hr|style|center|blockquote|font|figure|figcaption|details|summary|svg|iframe)\b)/i;
 for(const candidate of candidates){const v=candidate.trim();if(starts.test(v)&&/<\/?(?:html|head|body|div|section|article|main|header|footer|table|thead|tbody|tr|td|th|p|span|h[1-6]|ul|ol|li|a|img|br|hr|style|center|blockquote|font|figure|figcaption|details|summary|svg|iframe)\b/i.test(v))return v;}
 return '';
}
function extractEditorHtmlSource(source){
 let raw=String(source||'').trim(),css=[];
 raw=raw.replace(/<style\b[^>]*>([\s\S]*?)<\/style\s*>/gi,(_,rules)=>{css.push(rules);return ''});
 const bodyMatch=raw.match(/<body\b[^>]*>([\s\S]*?)<\/body\s*>/i);
 if(bodyMatch)raw=bodyMatch[1];
 else raw=raw.replace(/<!doctype[^>]*>/gi,'').replace(/<head\b[^>]*>[\s\S]*?<\/head\s*>/gi,'').replace(/<\/?html\b[^>]*>/gi,'').replace(/<\/?body\b[^>]*>/gi,'');
 raw=raw.replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi,'').replace(/<script\b[^>]*\/?>/gi,'');
 return {html:sanitize(raw),css:cleanEditorCss(css.join('\n\n'))};
}
function cleanEditorCss(css){
 return String(css||'').replace(/<\/style/gi,'').replace(/\/\*[\s\S]*?\*\//g,'')
  .replace(/@import\b[^;]*;?/gi,'').replace(/expression\s*\([^)]*\)/gi,'')
  .replace(/javascript\s*:/gi,'').replace(/-moz-binding\s*:[^;}]+;?/gi,'')
  .replace(/\bbehavior\s*:[^;}]+;?/gi,'').trim();
}
function scopeEditorCss(css,scope){
 const source=cleanEditorCss(css);let out='',cursor=0,guard=0;
 while(cursor<source.length&&guard++<500){
  const open=source.indexOf('{',cursor);if(open<0)break;
  const selector=source.slice(cursor,open).trim();let depth=1,end=open+1,quote='',escaped=false;
  for(;end<source.length&&depth;end++){
   const ch=source[end];
   if(quote){if(escaped)escaped=false;else if(ch==='\\')escaped=true;else if(ch===quote)quote='';continue}
   if(ch==='"'||ch==="'"){quote=ch;continue}
   if(ch==='{')depth++;else if(ch==='}')depth--;
  }
  if(depth)break;
  const body=source.slice(open+1,end-1);
  if(!selector){cursor=end;continue}
  if(/^@(media|supports|container|layer|document)\b/i.test(selector)){out+=selector+'{'+scopeEditorCss(body,scope)+'}';}
  else if(/^@(?:keyframes|-webkit-keyframes|font-face|page|property)\b/i.test(selector)){/* Keep global CSS at-rules out of the live editor for safety. */}
  else if(selector.startsWith('@')){/* Ignore unsupported CSS at-rules. */}
  else{
   const selectors=selector.split(/,(?![^()]*\))/).map(sel=>sel.trim()).filter(Boolean).map(sel=>{
    if(/^(?:html|:root)\b/i.test(sel))return scope+sel.replace(/^(?:html|:root)\b/i,'');
    if(/^body\b/i.test(sel))return scope+sel.replace(/^body\b/i,'');
    if(sel==='*')return scope+' *';
    return scope+' '+sel;
   });
   if(selectors.length)out+=selectors.join(',')+'{'+body+'}';
  }
  cursor=end;
 }
 return out;
}
function setEditorSourceCss(ed,css){
 if(!ed)return;const area=ed.querySelector('.ed-area'),clean=cleanEditorCss(css||'');
 if(clean){ed.dataset.sourceCss=clean;if(area)area.dataset.editorCssScope=ed.id;const styleId='editor-scope-'+ed.id;let node=document.getElementById(styleId);if(!node){node=document.createElement('style');node.id=styleId;document.head.appendChild(node)}node.textContent=scopeEditorCss(clean,'[data-editor-css-scope="'+ed.id+'"]');}
 else{delete ed.dataset.sourceCss;area?.removeAttribute('data-editor-css-scope');document.getElementById('editor-scope-'+ed.id)?.remove();}
}

function edGet(ed){
 if(!ed)return{mode:'rich',content:''};
 const code=ed.querySelector('.char-bio-code');
 if(code){if(ed.dataset.outputMode==='html')return{mode:'html',content:String(code.value||'').trim()};const clean=cleanCharacterBio(code.value),meaningful=textLen(clean,'rich')>0||/<(img|iframe|hr|table|div|h[1-6]|ul|ol|li|p)\b/i.test(clean);return{mode:'rich',content:meaningful?clean:''}}
 const area=ed.querySelector('.ed-area'),source=ed.querySelector('.ed-source-area');
 if(!area)return{mode:'rich',content:''};
 if(ed.dataset.htmlSource==='1')return{mode:'html',content:String(source?.value||'').trim()};
 if(!area.children.length){
  const pasted=getEditorHtmlSource(area.textContent||'');
  if(pasted){const parts=extractEditorHtmlSource(pasted);if(parts.html){area.innerHTML=parts.html;setEditorSourceCss(ed,parts.css);}}
 }
 let raw='';
 {
  const copy=area.cloneNode(true);
  copy.querySelectorAll('pre.html-source-block').forEach(block=>{
   const rendered=document.createElement('div');rendered.innerHTML=sanitize(block.textContent||'');block.replaceWith(...rendered.childNodes);
  });
  raw=copy.innerHTML||copy.textContent||'';
 }
 const clean=sanitize(raw).trim();
 const meaningful=textLen(clean,'rich')>0||/<(img|iframe|hr|table|div|h[1-6]|ul|ol|li|p)\b/i.test(clean);
 const css=ed.dataset.sourceCss||'';
 if(css)return{mode:'html',content:editorCssDocument(clean,css)};
 return{mode:'rich',content:meaningful?clean:''};
}

function initEditors(){
 document.querySelectorAll('.ed:not([data-ok])').forEach(ed=>{
  ed.dataset.ok=1;
  const a=ed.querySelector('.ed-area'),source=ed.querySelector('.ed-source-area'),dk=ed.dataset.draft?'sa_draft_'+ed.dataset.draft:'';
  if(dk&&a&&!a.innerHTML.trim()){
   const d=store.getItem(dk);
   if(d){
    try{
     if(d.startsWith(EDITOR_VISUAL_DRAFT_PREFIX)){
      const saved=JSON.parse(d.slice(EDITOR_VISUAL_DRAFT_PREFIX.length));a.innerHTML=sanitize(saved.html||'');setEditorSourceCss(ed,saved.css||'');
      if(source&&saved.sourceMode){source.value=saved.source||'';ed.dataset.htmlSource='1'}
     }else{
      const oldPrefix='__STARLIGHT_HTML_SOURCE__'+'\\'+'n';
      const oldNewlinePrefix='__STARLIGHT_HTML_SOURCE__'+'\n';
      const legacySource=d.startsWith(oldPrefix)?d.slice(oldPrefix.length):d.startsWith(oldNewlinePrefix)?d.slice(oldNewlinePrefix.length):d;
      const pasted=getEditorHtmlSource(legacySource);
      if(pasted){const parts=extractEditorHtmlSource(pasted);a.innerHTML=parts.html;setEditorSourceCss(ed,parts.css)}else a.innerHTML=sanitize(d);
     }
    }catch(err){a.innerHTML=sanitize(d)}
    const sourceMode=ed.dataset.htmlSource==='1';a.hidden=sourceMode;if(source)source.hidden=!sourceMode;ed.classList.toggle('html-source-mode',sourceMode);
    const bar=ed.querySelector('.ed-bar');if(bar)bar.hidden=sourceMode;
    setTimeout(()=>toast('กู้คืนฉบับร่างที่เขียนค้างไว้ให้แล้ว ✍️'),300);
   }
  }
  if(a)a.addEventListener('input',()=>{edCount(ed);saveEditorDraft(ed,a,dk)});
  if(source)source.addEventListener('input',()=>{edCount(ed);saveEditorDraft(ed,a,dk)});
  if(a)a.addEventListener('paste',e=>{
   if(ed.dataset.htmlSource==='1')return;
   const clip=e.clipboardData,tx=clip.getData('text/plain'),h=clip.getData('text/html');e.preventDefault();
   let found=getEditorHtmlSource(tx);
   if(!found&&h){
    const tmp=document.createElement('template');tmp.innerHTML=h;
    const code=tmp.content.querySelector('pre code,pre');
    if(code)found=getEditorHtmlSource(code.textContent||'');
    if(!found)found=getEditorHtmlSource(tmp.content.textContent||'');
   }
   if(found){const parts=extractEditorHtmlSource(found);insertEditorPaste(ed,parts.html,parts.css);return}
   if(h){insertEditorPaste(ed,sanitize(h));return}
   document.execCommand('insertText',false,tx);a.dispatchEvent(new Event('input',{bubbles:true}));edCount(ed);
  });
  ['keyup','mouseup'].forEach(ev=>a?.addEventListener(ev,saveSel));
  a?.addEventListener('blur',()=>{if(ed.dataset.htmlSource!=='1')edParseInlineHTML(a);saveSel();});
  ed.addEventListener('keydown',e=>{
   if(e.target?.matches('.char-bio-code'))return;
   if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ed.closest('form')?.requestSubmit();return}
   if(e.key==='Enter'){
    const sel=window.getSelection(),node=sel?.anchorNode,pre=(node?.nodeType===1?node:node?.parentElement)?.closest('pre.html-source-block');
    if(pre&&ed.contains(pre)){e.preventDefault();ex(ed.id,'insertHTML','<br>')}
   }
  });
  edUI(ed);
 });
}

function radar(stats,size=220){
 const n=STATS.length,c=size/2,R=size/2-20;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c+Math.cos(a)*R*v,c+Math.sin(a)*R*v]};
 const poly=fn=>STATS.map((s,i)=>pt(i,fn(s)).map(x=>x.toFixed(1)).join(',')).join(' ');
 let g='';
 [.25,.5,.75,1].forEach(l=>g+=`<polygon points="${poly(()=>l)}" style="fill:none;stroke:var(--line)"/>`);
 STATS.forEach((s,i)=>{const [x,y]=pt(i,1),[lx,ly]=pt(i,1+22/R);g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" style="stroke:var(--line)"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${s.e} ${s.n}</text>`});
 g+=`<polygon points="${poly(s=>Math.min(1,(stats[s.k]||0)/100))}" style="fill:color-mix(in srgb,var(--pri) 35%,transparent);stroke:var(--pri);stroke-width:2"/>`;
 return `<svg class="radar" viewBox="-45 -10 ${size+90} ${size+20}" width="${size+90}">${g}</svg>`;
}

 }).join('')}</div>`;
 return `<div class="mail-page"><div class="mail-page-head"><div><span class="qu-modal-kicker">STARLIGHT MESSAGES</span><h2>✉️ คลังจดหมาย</h2><p class="mut" style="margin:4px 0 0">ส่งข้อความส่วนตัวถึงสมาชิกคนอื่นได้ที่นี่</p></div><button class="btn" onclick="openMailCompose()">＋ เขียนจดหมาย</button></div>

function pageMail(folder){
 const u=me();if(!u)return go('login');
 folder=folder==='sent'?'sent':'inbox';
 const cache=mailCacheFor(u.id);
 app(mailPageMarkup(folder));
 if(!cache.loaded[folder]&&!cache.loading[folder]&&!cache.error[folder])loadMailFolder(folder,u.id);
}
async function loadMailFolder(folder,ownerId){
 const cache=mailCacheFor(ownerId);if(cache.loading[folder])return;
 cache.loading[folder]=true;cache.error[folder]='';
 if(ROUTE==='mail/'+folder)app(mailPageMarkup(folder));
 try{
  if(supaClient&&cloudReady){
   const {data,error}=await supaClient.rpc('site_mail_list',{p_folder:folder});
   if(error)throw error;
   cache[folder]=Array.isArray(data)?data:[];
  }else{
   const all=DB.get('mail');
   cache[folder]=all.filter(m=>folder==='inbox'?(m.recipientId===ownerId&&!m.recipientDeleted):(m.senderId===ownerId&&!m.senderDeleted)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }
  cache.loaded[folder]=true;
 }catch(err){
  cache.error[folder]=err?.message||String(err);cache.loaded[folder]=false;
 }finally{
  cache.loading[folder]=false;
  if(me()?.id===ownerId){if(ROUTE.split('/')[0]==='mail')render();else renderNav();}
 }
}
function retryMailFolder(folder){
 const u=me();if(!u)return go('login');
 const cache=mailCacheFor(u.id);cache.error[folder]='';cache.loaded[folder]=false;cache.loading[folder]=false;pageMail(folder);
}

/* ================= THREAD LIST / STARTER AVATARS ================= */
function threadStarterUser(t){
 return DB.get('users').find(x=>x.id===t?.authorId)||null;
}
function threadAuthorCharacter(t){
 if(!t||t.authorMode==='academy'||t.authorMode==='gm'||(!t.authorMode&&t.type==='notice'))return null;
 const chars=DB.get('characters');
 // For character-archive threads, prefer the character that actually owns/uses this archive URL.
 // This prevents the account's first/main character from being shown for a secondary character.
 if(t.characterBio){
  const linked=chars.find(c=>c.ownerId===t.authorId&&c.bioThreadId===t.id);
  if(linked)return linked;
 }
 const authorChar=chars.find(c=>c.id===t.authorCharId&&c.ownerId===t.authorId);
 if(authorChar)return authorChar;
 return (!t.authorMode?chars.find(c=>c.ownerId===t.authorId&&c.status==='approved'):null)||null;
}
function threadAuthorName(t){
 if(t?.authorMode==='academy')return 'Starlight_Academy';
 if(t?.authorMode==='gm'||(!t?.authorMode&&t?.type==='notice'))return S.gmName||'ผู้ดำเนินเรื่อง';
 const c=threadAuthorCharacter(t);
 return c?(c.stageName||c.name):(threadStarterUser(t)?.username||'สมาชิก');
}
function threadAuthorSubtitle(t){
 const c=threadAuthorCharacter(t);
 if(t?.authorMode==='academy')return 'บัญชีสถาบัน';
 if(t?.authorMode==='gm'||(!t?.authorMode&&t?.type==='notice'))return 'ผู้ดำเนินเรื่อง';
 return c?'ตัวละคร · '+(threadStarterUser(t)?.username||'สมาชิก'):'ผู้เปิดกระทู้';
}
function threadAuthorAvatar(t,size=54){
 const user=threadStarterUser(t);
 if(t?.authorMode==='academy')return avatar(user,size);
 const c=threadAuthorCharacter(t);
 return avatar(c||user,size);
}
function threadStarterSide(t,opener,openingChar,cnt){
 if(t?.authorMode==='academy')return academySide(opener);
 if(t?.authorMode==='gm'||(!t?.authorMode&&t?.type==='notice'))return gmSide();
 if(openingChar)return sideCard(openingChar,opener,cnt(openingChar.id));
 return `<aside class="side" style="--ac:var(--pri)"><div class="side-por"><div class="ini">${esc((opener?.username||'?')[0])}</div>${String(opener?.avatar||'').startsWith('http')?`<img src="${esc(opener.avatar)}" loading="lazy" onerror="this.remove()">`:''}<div class="side-name"><small>THREAD STARTER</small><b><a href="#profile/${opener?.id||''}" style="color:inherit">${esc(opener?.username||'สมาชิก')}</a></b><span>ผู้เปิดกระทู้</span></div></div><div class="side-body"><a class="side-btn" href="#profile/${opener?.id||''}">ดูโปรไฟล์</a></div></aside>`;

function threadListSummary(t){
 const source=String(t?.plot||'');
 // Full HTML/CSS profiles belong in the thread itself, not in the short list preview.
 if(t?.characterBio||t?.plotMode==='html'||source.toLowerCase().includes('<!doctype html')||source.toLowerCase().includes('<style')||source.toLowerCase().includes('<script')){
  return t?.characterBio?'📖 ประวัติตัวละครฉบับเต็ม · กดเพื่ออ่านรายละเอียด':'เปิดกระทู้เพื่ออ่านเนื้อหาเต็ม';
 }

  .replace(/&nbsp;|&#160;/gi,' ')

function characterBioRpcError(action,error){
 const message=String(error?.message||error||'');
 if(/PGRST202|schema cache|could not find the function|function .* does not exist/i.test(message)){
  return 'Supabase ยังไม่ติดตั้ง RPC ของคลังประวัติตัวละคร กรุณารันไฟล์ supabase/character_bio_threads.sql ใน Supabase Dashboard → SQL Editor แล้วรีโหลดเว็บ';
 }
 return action+'ไม่สำเร็จ: '+message;
}
function characterBioReadableLength(content,mode){
 const value=String(content||'');
 if(mode!=='html')return textLen(value,'rich');
 const readable=value.replace(/<(style|script|head)\b[\s\S]*?<\/\1>/gi,' ')
  .replace(/<!--[\s\S]*?-->/g,' ').replace(/<!doctype[^>]*>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ')
  .replace(/\s+/g,' ').trim();
 return readable.length;
}
async function doCreateCharacterBioThread(e){
 e.preventDefault();const u=me(),f=e.target,E=f.elements;if(!u)return go('login');

 const title=E.title.value.trim(),bio=edGet(edOf(f,'background'));
 if(title.length<3)return toast('กรุณาตั้งชื่อกระทู้ให้ชัดเจน','bad');
 if(!bio.content||characterBioReadableLength(bio.content,bio.mode)<80)return toast('กรุณาเขียนประวัติที่อ่านได้อย่างน้อย 80 ตัวอักษร','bad');
 if(!DB.get('forums').some(x=>x.id===CHARACTER_BIO_FORUM_ID))return toast('ไม่พบคลังประวัติตัวละคร กรุณารีเฟรชหน้าเว็บ','bad');
 const th={id:uid(),authorId:u.id,authorCharId:getActiveChar(u)?.id||null,title,type:'bio',forumId:CHARACTER_BIO_FORUM_ID,
  exp:0,won:0,minStage:0,maxStage:STAGES.length-1,agencyId:'',train:[],statGain:0,plot:bio.content,plotMode:bio.mode,rules:'',rulesMode:'rich',
  css:'',tpl:'',deadline:'',pinned:false,status:'open',createdAt:Date.now(),characterBio:true};
 if(cloudReady){
  const {error}=await supaClient.rpc('site_create_character_bio_thread',{p_thread:th});
  if(error)return toast(characterBioRpcError('บันทึกกระทู้ประวัติ',error),'bad');
  await cloudRefresh(false);
 }else{
  const threads=DB.get('threads');threads.push(th);DB.set('threads',threads);
 }
 characterStudioClearDraft();
 toast('เผยแพร่กระทู้ประวัติแล้ว — คัดลอก URL มาแนบในใบสมัครตัวละครได้เลย');
 go('thread/'+th.id);
}
function characterBioUrl(id){return id?location.origin+location.pathname+'#thread/'+encodeURIComponent(id):''}
function getCharacterBioThreadFromUrl(value,expectedOwnerId){
 const raw=String(value||'').trim();if(!raw)return null;
 let link;try{link=new URL(raw,location.href)}catch(e){return null}
 if(link.origin!==location.origin||link.pathname.replace(/\/+$/,'')!==location.pathname.replace(/\/+$/,''))return null;
 const match=link.hash.match(/^#thread\/([^/?&]+)/);if(!match)return null;
 const id=decodeURIComponent(match[1]);
 const thread=DB.get('threads').find(t=>t.id===id);
 if(!thread||thread.characterBio!==true||thread.forumId!==CHARACTER_BIO_FORUM_ID||thread.authorId!==expectedOwnerId)return null;

let presenceSnapshot=null,presenceError='',presenceBusy=false,presenceStarted=false;
function presenceSessionId(user){
 // Use a separate presence record per signed-in app user, plus one anonymous browser session.
 // This preserves today's history when someone signs out or another member uses the same browser.
 const safeUserId=user&&user.id?String(user.id).replace(/[^A-Za-z0-9-]/g,''):'';
 const key=safeUserId?'sa_presence_session_member_'+safeUserId:'sa_presence_session_visitor';
 let id=store.getItem(key)||'';
 if(!/^[A-Za-z0-9-]{16,80}$/.test(id)){
  try{id=window.crypto&&typeof window.crypto.randomUUID==='function'?window.crypto.randomUUID():''}catch(e){id=''}
  if(!id)id='presence-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);
  store.setItem(key,id);
 }
 return id;
}
function presenceSafeColor(value,fallback='#d6d6dc'){
 return typeof value==='string'&&/^#[0-9a-f]{6}$/i.test(value)?value:fallback;
}
function presenceMemberColor(user,activeCharacter){
 const rank=presenceGroupForStage(activeCharacter?.stage);
 const color=STAGES&&STAGES[rank.stage]?STAGES[rank.stage].c:'';
 return presenceSafeColor(color,'#d6d6dc');
}
function renderCommunityPresence(){
 const root=document.getElementById('communityPresence');if(!root)return;
 if(!presenceSnapshot){
  if(presenceError){
   root.innerHTML='<div class="presence-error"><b>ยังโหลดสถานะชุมชนไม่ได้</b><span>'+esc(presenceError)+'</span><p style="margin:8px 0 0">หากเพิ่งติดตั้งระบบนี้ ให้ตรวจว่ารันไฟล์ <code>online-presence-migration.sql</code> ใน Supabase SQL Editor แล้ว</p></div>';
  }else{
   root.innerHTML='<div class="presence-error"><b>กำลังเชื่อมต่อสถานะชุมชน…</b><span>กำลังตรวจสอบผู้ใช้งานล่าสุด</span></div>';
  }
  return;
 }
 const data=presenceSnapshot||{};
 const onlineMembers=Math.max(0,Number(data.members_online)||0);
 const hiddenMembers=Math.max(0,Number(data.hidden_members)||0);
 const visitors=Math.max(0,Number(data.visitors_online)||0);
 const totalMembers=Math.max(0,Number(data.total_members)||0);
 const activeTotal=onlineMembers+hiddenMembers+visitors;
 const people=Array.isArray(data.online_today)?data.online_today:[];
 const groups=ONLINE_GROUPS.map(group=>{
  const members=people.filter(person=>(ONLINE_GROUPS.some(item=>item.id===person.online_group)?person.online_group:'applicant')===group.id);
  const names=members.length?members.map(person=>{
   const color=presenceSafeColor(person.display_color);
   const href='#profile/'+encodeURIComponent(String(person.app_user_id||''));
   return '<a class="presence-name" href="'+esc(href)+'" style="--presence-user-color:'+color+'" title="ดูลโปรไฟล์ '+esc(person.username||'สมาชิก')+'">'+esc(person.username||'สมาชิก')+'</a>';
  }).join(''):'<span class="presence-empty">ยังไม่มีสมาชิกในหมวดนี้</span>';
  return '<section class="presence-group"><div class="presence-group-heading"><span class="presence-group-icon" aria-hidden="true">'+group.icon+'</span><b>'+esc(group.label)+'</b><span class="presence-group-count">'+members.length+'</span></div><div class="presence-names">'+names+'</div></section>';
 }).join('');
 root.innerHTML=
  '<div class="presence-shell">'+
   '<div class="presence-top"><div class="presence-top-copy"><span class="presence-eyebrow">COMMUNITY / ACTIVITY</span><h2>ผู้ใช้งานล่าสุด</h2><p class="presence-head-count"><b>'+activeTotal+'</b> ผู้ใช้งานที่ออนไลน์ภายใน 5 นาทีที่ผ่านมา</p><p class="presence-head-meta">สมาชิก '+onlineMembers+' คน · '+hiddenMembers+' ซ่อนตัว · '+visitors+' ผู้เยี่ยมชม · สมาชิกทั้งหมด '+totalMembers+' คน</p></div>'+
   '<div class="presence-counters"><span class="presence-counter"><i class="presence-live-dot"></i><b>'+onlineMembers+'</b> สมาชิกออนไลน์</span><span class="presence-counter"><b>'+hiddenMembers+'</b> ซ่อนตัว</span><span class="presence-counter"><b>'+visitors+'</b> ผู้เยี่ยมชม</span></div></div>'+
   '<div class="presence-divider"></div>'+
   '<div class="presence-today"><div class="presence-today-heading"><div><h3>ผู้ใช้ออนไลน์วันนี้</h3><p>รายชื่อสมาชิกที่ใช้งานวันนี้ โดยชื่อจะแสดงตามสีระดับขั้นของตัวละครที่กำลังใช้</p></div><span class="presence-today-total">'+people.length+' สมาชิกที่แสดงชื่อ</span></div>'+
   '<div class="presence-groups">'+groups+'</div></div>'+
   '<div class="presence-footnote">อัปเดตอัตโนมัติทุก 1 นาที · นับผู้ใช้งานล่าสุดในช่วง 5 นาที · เวลาอ้างอิงประเทศไทย</div>'+
  '</div>';
}
async function refreshCommunityPresence(){
 if(presenceBusy||document.hidden)return;
 if(!supaClient){
  presenceError='เชื่อมต่อ Supabase ไม่สำเร็จ';
  renderCommunityPresence();return;
 }
 presenceBusy=true;
 try{
  const user=me(),prefs=user?.prefs||{};
  const activeCharacter=user?getActiveChar(user):null;
  const onlineGroup=presenceGroupForStage(activeCharacter?.stage).id;
  const displayColor=presenceMemberColor(user,activeCharacter);
  const {data:heartbeat,error:heartbeatError}=await supaClient.rpc('site_presence_heartbeat',{
   p_session_id:presenceSessionId(user),
   p_hidden:!!(user&&prefs.hideOnline),
   p_online_group:onlineGroup,
   p_display_color:displayColor
  });
  if(heartbeatError)throw heartbeatError;
  if(!heartbeat||heartbeat.ok!==true)throw new Error('ฐานข้อมูลไม่ยืนยันการอัปเดตสถานะออนไลน์');
  const {data,error}=await supaClient.rpc('site_presence_summary');
  if(error)throw error;
  if(!data||data.ok!==true)throw new Error('ฐานข้อมูลไม่สามารถส่งสรุปสถานะออนไลน์ได้');
  presenceSnapshot=data;presenceError='';
 }catch(error){
  console.error('Community presence refresh failed:',error);
  presenceError=error?.message||String(error)||'เกิดข้อผิดพลาดในการอ่านสถานะชุมชน';
 }finally{
  presenceBusy=false;
  renderCommunityPresence();
 }
}
function startPresenceTracking(){
 if(presenceStarted)return;
 presenceStarted=true;
 renderCommunityPresence();
 refreshCommunityPresence();
 window.setInterval(()=>{if(!document.hidden)refreshCommunityPresence()},60000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCommunityPresence()});
 window.addEventListener('focus',()=>{if(!document.hidden)refreshCommunityPresence()});
}

async function doLogin(e){

  const signed=await supaClient.auth.signInWithPassword({email:cloudAuthEmail(username),password:pw});
  authData=signed.data;authError=signed.error;
  if(authError){
   if(!legacy||!legacy.pass||legacy.pass!==h)return toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง','bad');
   const created=await supaClient.auth.signUp({email:cloudAuthEmail(username),password:pw,options:{data:{app_user_id:legacy.id,username:legacy.username}}});
   if(created.error)return toast('ยืนยันรหัสผ่านเดิมแล้ว แต่สร้างบัญชี Cloud ไม่สำเร็จ: '+created.error.message,'bad');

   authData=created.data;authError=null;
  }
  try{
   const profile=await cloudCompleteAuth(authData.user);
   const list=DB.get('users'),idx=list.findIndex(x=>x.id===profile.app_user_id);
   const local=idx>=0?list[idx]:legacy;
   if(local){
    const keepLegacyAdmin=local.role==='admin'&&profile.role!=='admin'&&!cloudReady;
    const next={...local,id:profile.app_user_id,username:profile.username,role:keepLegacyAdmin?'admin':profile.role};
    if(idx>=0)list[idx]=next;else list.push(next);
   }else list.push({id:profile.app_user_id,username:profile.username,pass:'',avatar:'',role:profile.role,createdAt:Date.now()});
   DB.set('users',list);
   store.setItem('sa_session',profile.app_user_id);
   const needsAdminPromotion=!!(local&&local.role==='admin'&&profile.role!=='admin'&&!cloudReady);
   go('home');
   if(needsAdminPromotion||cloudFirstAdminUsername)cloudShowFirstAdminSetup(profile.username);
   else toast('ยินดีต้อนรับกลับ, '+profile.username);
  }catch(err){console.error(err);toast('เข้าสู่ระบบได้ แต่เชื่อมข้อมูล Cloud ไม่สำเร็จ: '+(err?.message||String(err)),'bad')}
  return;
 }
 const u=DB.get('users').find(x=>x.username.toLowerCase()===username.toLowerCase()&&x.pass===h);
 if(!u)return toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง','bad');
 store.setItem('sa_session',u.id);toast('ยินดีต้อนรับกลับ, '+u.username);go('home');
}

async function copyPostLink(threadId,postId){
 const url=location.origin+location.pathname+location.search+'#thread/'+threadId+'/post-'+encodeURIComponent(postId);
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);toast('คัดลอกลิงก์โพสต์แล้ว');return}
 }catch(e){}
 try{
  const input=document.createElement('textarea');input.value=url;input.setAttribute('readonly','');input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();
  const ok=document.execCommand('copy');input.remove();
  if(ok){toast('คัดลอกลิงก์โพสต์แล้ว');return}
 }catch(e){}
 prompt('คัดลอกลิงก์โพสต์นี้',url);
}

  const len=textLen(content,mode);if(len<MIN_POST)return toast(`เนื้อหาต้องยาวอย่างน้อย ${MIN_POST} ตัวอักษร (ตอนนี้ ${len})`,'bad');
  const tr=(t.train||[]).includes(E.train?.value)?E.train.value:null;
  if(cloudReady){

   toast(`+${t.exp} EXP${w?` · +${wonFmt(w)}`:''}${tr?` · ${statOf(tr).n} +${gain}`:''}`);
  }else{
   let gain=0,capped=false;
   const nc=update('characters',ac.id,o=>{o.exp+=Number(t.exp)||0;
    if(tr){const cap=statCap(o.stage),old=o.stats[tr]||0;o.stats[tr]=Math.max(old,Math.min(cap,old+(Number(t.statGain)||0)));gain=o.stats[tr]-old;capped=old>=cap}});
   const w=Number(t.won)||0;if(w)addWon(ac.id,w,'โพสต์: '+t.title);
   posts.push({...base,charId:ac.id,gm:false,train:tr,gain,wonGain:w});DB.set('posts',posts);

  }
 }

async function practice(id,k){
 const u=me(),c=DB.get('characters').find(x=>x.id===id),st=statOf(k);
 if(!c||c.ownerId!==u?.id||c.status!=='approved')return;
 const left=(c.lastPractice||0)+PRACTICE_CD-Date.now();if(left>0)return toast(`ยังเหนื่อยอยู่! ซ้อมได้อีกใน ${fmtLeft(left)}`,'bad');
 const cap=statCap(c.stage);if((c.stats[k]||0)>=cap)return toast(`${st.n}ถึงเพดานของขั้นนี้แล้ว (${cap})`,'bad');
 if(cloudReady){
  const {data,error}=await supaClient.rpc('site_practice',{p_character_id:id,p_stat:k});
  if(error)return toast('ซ้อมไม่สำเร็จ: '+error.message,'bad');
  await cloudRefresh(false);
  toast(`${Number(data?.gain)===2?'🔥 ซ้อมได้ผลดีเป็นพิเศษ! ':''}${st.e} ${st.n} +${Number(data?.gain)||0} · +${Number(data?.exp_gain)||PRACTICE_EXP} EXP`);render();return;
 }
 const g=Math.random()<.3?2:1;
 update('characters',id,o=>{o.stats[k]=Math.min(cap,(o.stats[k]||0)+g);o.exp+=PRACTICE_EXP;o.lastPractice=Date.now()});
 toast(`${g===2?'🔥 ซ้อมได้ผลดีเป็นพิเศษ! ':''}${st.e} ${st.n} +${g} · +${PRACTICE_EXP} EXP`);render();
}

async function moveForum(id,delta){
 if(!hasAdminPermission('manage_forums'))return toast('ไม่มีสิทธิ์จัดการฟอรั่ม','bad');
 if(forumOrderSyncInProgress)return toast('กำลังบันทึกลำดับฟอรั่ม กรุณารอสักครู่');
 const forums=DB.get('forums'),f=forums.find(x=>x.id===id);if(!f)return;
 const siblings=forums.filter(x=>x.catId===f.catId).sort((a,b)=>(Number(a.order)||9999)-(Number(b.order)||9999));
 const from=siblings.findIndex(x=>x.id===id),to=from+delta;if(from<0||to<0||to>=siblings.length)return;
 [siblings[from],siblings[to]]=[siblings[to],siblings[from]];
 siblings.forEach((x,i)=>x.order=i+1);
 const errorVersionBefore=cloudSyncErrorVersion;
 forumOrderSyncInProgress=true;
 DB.set('forums',forums);
 render();
 // Local-only mode can finish immediately. With cloud enabled, wait for every order write
 // before allowing realtime refresh to replace the just-saved list.
 if(!supaClient||!cloudReady){
  forumOrderSyncInProgress=false;
  toast('เปลี่ยนลำดับฟอรั่มแล้ว');
  return;
 }
 try{
  await cloudQueue;
  const syncFailed=cloudSyncErrorVersion>errorVersionBefore;
  forumOrderSyncInProgress=false;
  await cloudRefresh(false);
  render();
  if(syncFailed)return; // cloudSyncCollection already displayed the specific sync error.
  toast('เปลี่ยนลำดับฟอรั่มแล้ว');
 }catch(err){
  forumOrderSyncInProgress=false;
  console.error('Forum order save failed:',err);
  toast('บันทึกลำดับฟอรั่มไม่สำเร็จ: '+(err?.message||'กรุณาลองอีกครั้ง'),'bad');
 }
}

async function saveAdminPermissions(id){
 const wrap=document.getElementById('adminPermissionModal');if(!wrap)return;
 const status=wrap.querySelector('#adminPermissionsStatus');
 const saveBtn=wrap.querySelector('#adminPermissionsSave');
 const setStatus=(message,kind='info')=>{
  if(status){
   status.textContent=message;
   status.style.display='block';
   status.style.borderColor=kind==='error'?'var(--bad)':'var(--line)';
   status.style.color=kind==='error'?'var(--bad)':'var(--txt)';
  }else toast(message,kind==='error'?'bad':'ok');
 };
 const setBusy=busy=>{
  if(!saveBtn)return;
  saveBtn.disabled=busy;
  saveBtn.textContent=busy?'กำลังบันทึก…':'บันทึกสิทธิ์';
  saveBtn.setAttribute('aria-busy',busy?'true':'false');
 };
 if(saveBtn?.disabled)return;
 if(!isAdmin()){setStatus('บันทึกไม่ได้: บัญชีนี้ไม่มีสิทธิ์แอดมินหลัก กรุณาออกจากระบบแล้วเข้าสู่ระบบใหม่','error');return;}
 const target=DB.get('users').find(x=>x.id===id),owner=me();
 if(!target||target.id===owner?.id){setStatus('บันทึกไม่ได้: ไม่พบบัญชีเป้าหมาย หรือไม่สามารถแก้สิทธิ์บัญชีที่กำลังใช้งานได้','error');return;}
 const users=DB.get('users'),index=users.findIndex(x=>x.id===id);
 if(index<0){setStatus('บันทึกไม่ได้: ไม่พบบัญชีสมาชิกในข้อมูลที่โหลดอยู่','error');return;}
 const permissions=[...wrap.querySelectorAll('input[name="adminPermission"]:checked')].map(x=>x.value);
 setBusy(true);
 setStatus('กำลังบันทึกสิทธิ์ลงฐานข้อมูล Cloud…');
 try{
  if(!supaClient)throw new Error('ไม่สามารถเริ่มการเชื่อมต่อ Supabase ได้ กรุณารีเฟรชเว็บ');
  if(!cloudReady)throw new Error('ข้อมูล Cloud ยังโหลดไม่เสร็จ กรุณารีเฟรชเว็บ รอให้ข้อมูลโหลด แล้วลองอีกครั้ง');
  const {data,error}=await supaClient.rpc('site_set_admin_permissions',{p_app_user_id:id,p_permissions:permissions});
  if(error)throw error;
  if(!data||data.ok!==true)throw new Error('ฐานข้อมูลไม่ได้ยืนยันว่าบันทึกสำเร็จ กรุณาตรวจสอบ Migration');
  const updatedUser={...users[index],role:permissions.length?'admin':'player',permissions};
  users[index]=updatedUser;
  store.setItem('sa_users',JSON.stringify(users));
  wrap.remove();
  toast(permissions.length?'บันทึกสิทธิ์แอดมินแล้ว':'ถอดสิทธิ์แอดมินแล้ว');
  render();
 }catch(error){
  console.error('Admin permission save failed:',error);
  const message=error?.message||String(error)||'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ';
  setStatus('บันทึกไม่สำเร็จ\n'+message,'error');
  setBusy(false);
 }
}
